name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          # Windows + 3.13 has known asyncio issues, skip for now
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check arnes/ tests/

      - name: Format check with ruff
        run: uv run ruff format --check arnes/ tests/

      - name: Type check with mypy
        # AGENTS.md mandates ``mypy --strict`` must pass. Previously this was
        # non-blocking (``|| true``), which let type regressions slip through
        # CI. It is now a hard gate — fix the type errors rather than silence.
        run: uv run mypy arnes/ --strict

      - name: Test with pytest (with coverage floor >= 65%)
        # ``--cov-fail-under=65`` is set in pyproject.toml addopts too —
        # passing it here explicitly makes the coverage gate visible at the
        # CI step level so a future pyproject change can't silently disable it.
        run: |
          uv run pytest tests/ \
            --cov=arnes \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=65

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run bandit security scan
        run: uv run bandit -r arnes/ -c pyproject.toml

      - name: Run pip-audit
        run: |
          uv run pip-audit --ignore-vuln PYSEC-2026-1845 || true
          echo "pip-audit completed (non-blocking for dev dependencies)"

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
