# hola-mundo.md.yaml — Manual de ejemplo más simple
# Documentación: https://arnes.dev/playbook-dsl

nombre: hola-mundo
objetivo: Demostrar el flujo básico de ARNES con un manual simple
budget_usd: 0.10

pasos:
  - id: planificar
    especialista: "@planner"
    input:
      task: "Plan a 3-step process for writing a blog post about ARNES"

  - id: escribir_outline
    especialista: "@coder"
    input:
      spec: "Write a markdown outline based on the plan"
      context: "{{ pasos.planificar.salida }}"
