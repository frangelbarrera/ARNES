# auditar-pr.md.yaml — Auditar un Pull Request de forma estructurada
# Demuestra condicionales y paralelismo

nombre: auditar-pr
objetivo: Auditar un PR verificando seguridad, calidad y tests
budget_usd: 0.50

variables:
  pr_number: 1234
  repo: "mi-org/mi-repo"

pasos:
  - id: leer_diff
    especialista: "@reviewer"
    input:
      pr: "{{ variables.pr_number }}"
      repo: "{{ variables.repo }}"
      enfoque: "Leer el diff y estructurarlo para análisis posterior"

  - id: auditoria_seguridad
    especialista: "@reviewer"
    input:
      codigo: "{{ pasos.leer_diff.salida }}"
      enfoque: "Security review: auth flows, SQL injection, XSS, path traversal, secrets in diff"

  - id: paralelo
    paralelo:
      - id: lint
        especialista: "@reviewer"
        input:
          codigo: "{{ pasos.leer_diff.salida }}"
          enfoque: "Code quality: idioms, naming, complexity"
      - id: tests
        especialista: "@tester"
        input:
          codigo: "{{ pasos.leer_diff.salida }}"
          enfoque: "Verificar que los tests cubren los cambios del PR"

  - id: sintesis
    especialista: "@reviewer"
    input:
      diff: "{{ pasos.leer_diff.salida }}"
      security: "{{ pasos.auditoria_seguridad.salida }}"
      lint: "{{ pasos.paralelo.lint.salida }}"
      tests: "{{ pasos.paralelo.tests.salida }}"
      enfoque: "Sintetizar todo en un veredicto final: approve / request_changes / reject"
