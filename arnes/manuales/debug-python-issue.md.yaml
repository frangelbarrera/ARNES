# debug-python-issue.md.yaml — Manual para diagnosticar un bug de Python
# Uno de los playbooks "killer" que demuestra el valor de ARNES

nombre: debug-python-issue
objetivo: Diagnosticar un bug de Python desde el traceback hasta la propuesta de fix
budget_usd: 0.30

pasos:
  - id: leer_traceback
    especialista: "@debugger"
    input:
      error: |
        Traceback (most recent call last):
          File "src/app.py", line 42, in handle_request
            result = process_user(user_id)
          File "src/app.py", line 87, in process_user
            return db.query(User).filter(User.id == user_id).one()
          File "sqlalchemy/orm/query.py", line 3450, in one
            raise NoResultFound("No row was found when one() was required")
        sqlalchemy.exc.NoResultFound: No row was found when one() was required

  - id: revisar_fix
    especialista: "@reviewer"
    input:
      codigo: "{{ pasos.leer_traceback.salida }}"
      enfoque: "¿El fix propuesto maneja correctamente el caso None? ¿Oculta un bug subyacente?"

  - id: verificar_tests
    especialista: "@tester"
    input:
      codigo: "{{ pasos.leer_traceback.salida }}"
      enfoque: "Escribir test que reproduzca el bug original y verifique el fix"
