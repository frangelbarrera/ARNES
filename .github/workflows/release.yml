name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # id-token: write is required for PyPI Trusted Publishing (OIDC).
  # This lets GitHub Actions publish to PyPI without storing a long-lived
  # API token in repo secrets. Configure the trusted publisher at:
  # https://pypi.org/manage/project/arnes/settings/publishing/
  id-token: write

jobs:
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        # Uses PyPI Trusted Publishing (OIDC) — no API token needed.
        # The publisher is configured in PyPI to trust this repo +
        # workflow + environment.
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
