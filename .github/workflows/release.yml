name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@11bd7198bbe279f4140dcbf88bb6c56682c13f3d # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@e8ee2b35c3c044f4725d00c0fc4ef2b27523a5f5 # v3.2.5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build package
        run: uv build

      # TODO(v0.2): migrate to PyPI OIDC Trusted Publishing to eliminate the
      # long-lived ``PYPI_API_TOKEN`` secret. Trusted Publishing exchanges a
      # short-lived OIDC token issued by GitHub Actions for a PyPI publish
      # credential — no rotating tokens to leak, no shared credential across
      # maintainers. Requires configuring the project on PyPI as a Trusted
      # Publisher with this workflow file as the source of truth.
      #
      # When that lands, replace the env block below with:
      #   env:
      #     UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      # becomes:
      #   --publish-url https://upload.pypi.org/legacy/ + uv publish --token ${{ steps_oidc.outputs.token }}
      - name: Publish to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3fa29c7b719b2 # v2.0.8
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
