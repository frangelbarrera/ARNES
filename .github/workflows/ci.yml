name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          # Windows + 3.13 has known asyncio issues, skip for now
          - os: windows-latest
            python-version: "3.13"

    steps:
      # Pinned to SHA for supply-chain hardening — the comment records the
      # floating tag the SHA was promoted from. Update both atomically.
      - uses: actions/checkout@11bd7198bbe279f4140dcbf88bb6c56682c13f3d # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@e8ee2b35c3c044f4725d00c0fc4ef2b27523a5f5 # v3.2.5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check arnes/ tests/

      - name: Format check with ruff
        run: uv run ruff format --check arnes/ tests/

      - name: Type check with mypy
        # AGENTS.md mandates ``mypy --strict`` must pass. Previously this was
        # non-blocking (``|| true``), which let type regressions slip through
        # CI. It is now a hard gate — fix the type errors rather than silence.
        run: uv run mypy arnes/ --strict

      - name: Test with pytest (with coverage floor >= 65%)
        # ``--cov-fail-under=65`` is set in pyproject.toml addopts too —
        # passing it here explicitly makes the coverage gate visible at the
        # CI step level so a future pyproject change can't silently disable it.
        run: |
          uv run pytest tests/ \
            --cov=arnes \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=65

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e4ceed7749005 # v4.6.0
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd7198bbe279f4140dcbf88bb6c56682c13f3d # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@e8ee2b35c3c044f4725d00c0fc4ef2b27523a5f5 # v3.2.5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run bandit security scan
        run: uv run bandit -r arnes/ -c pyproject.toml

      - name: Run pip-audit
        # Blocking: previously `|| true` let known CVEs ship to release.
        # The single --ignore-vuln is for PYSEC-2026-1845, a known issue in
        # the transitive `pytest` dev dependency that has no fix available
        # upstream yet. Track removal in the v0.2 dependency refresh.
        run: uv run pip-audit --ignore-vuln PYSEC-2026-1845

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@11bd7198bbe279f4140dcbf88bb6c56682c13f3d # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@e8ee2b35c3c044f4725d00c0fc4ef2b27523a5f5 # v3.2.5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: dist
          path: dist/
